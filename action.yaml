name: 'Radicle Sync'
description: 'A GitHub Action that bidirectionally syncs your code with the Radicle peer-to-peer code hosting network.'
inputs:
  radicle-identity-passphrase:
    description: 'The passphrase for the Radicle identity (base64 encoded).'
    required: true
    default: ''
  radicle-identity-alias:
    description: 'An alias for your Radicle identity.'
    required: true
    default: ''
  radicle-identity-private-key:
    description: 'The private key for the machine account (base64 encoded).'
    required: true
    default: ''
  radicle-identity-public-key:
    description: 'The public key for the machine account (base64 encoded).'
    required: true
    default: ''
  radicle-repository-id:
    description: 'The repository ID (rad:xxx).'
    required: true
    default: ''
  radicle-project-name:
    description: 'The project name from rad inspect --payload.'
    required: true
    default: ''
  preferred-seeds:
    description: 'Comma-separated list of preferred seeds (e.g., nid@host:port,nid@host:port).'
    required: false
    default: ''
  git-user-name:
    description: 'Git user name for merge commits'
    required: false
    default: 'Radicle Mirror Bot'
  git-user-email:
    description: 'Git user email for merge commits'
    required: false
    default: 'radicle-mirror@users.noreply.github.com'
  pr-labels:
    description: 'Comma-separated list of labels to add to created PRs'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for authentication (use GitHub App token to trigger workflows on created PRs)'
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Restore Radicle Storage Cache
      uses: actions/cache/restore@v4
      id: cache-radicle
      with:
        path: ${{ github.workspace }}/.radicle/storage
        key: radicle-storage-${{ inputs.radicle-repository-id }}-v2

    - name: Run Sync Script
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GH_TOKEN: ${{ inputs.github-token }}
        RADICLE_IDENTITY_ALIAS: ${{ inputs.radicle-identity-alias }}
        RADICLE_IDENTITY_PRIVATE_KEY: ${{ inputs.radicle-identity-private-key }}
        RADICLE_IDENTITY_PUBLIC_KEY: ${{ inputs.radicle-identity-public-key }}
        RADICLE_REPOSITORY_ID: ${{ inputs.radicle-repository-id }}
        RADICLE_PROJECT_NAME: ${{ inputs.radicle-project-name }}
        PREFERRED_SEEDS: ${{ inputs.preferred-seeds }}
        GITHUB_REF_NAME: ${{ github.ref_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        CACHE_HIT: ${{ steps.cache-radicle.outputs.cache-hit }}
        GIT_USER_NAME: ${{ inputs.git-user-name }}
        GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        PR_LABELS: ${{ inputs.pr-labels }}
      run: |
        bash "${{ github.action_path }}/sync.sh"

    - name: Save Radicle Storage Cache
      uses: actions/cache/save@v4
      if: always() && steps.cache-radicle.outputs.cache-hit != 'true'
      with:
        path: ${{ github.workspace }}/.radicle/storage
        key: radicle-storage-${{ inputs.radicle-repository-id }}-v2
